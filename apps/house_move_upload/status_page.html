<!-- The "My move" screen, placed inside portal_shell.html. Styles are in portal.css. -->
<div id="app" aria-live="polite"><div class="skeleton" style="height:150px"></div><div class="skeleton"></div></div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
  <div class="grab"></div>
  <header><h2 id="sheet-title"></h2>
    <button class="icon-btn" type="button" id="sheet-close" aria-label="Close">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>
  <div class="body" id="sheet-body"></div>
  <footer id="sheet-foot"></footer>
</section>
<script>
// Everything from the case is rendered with textContent, so nothing in it is ever interpreted as HTML.
const el = (tag, text, cls) => {
  const e = document.createElement(tag);
  if (text !== undefined && text !== null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
};
const svg = (d) => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "2"); s.setAttribute("stroke-linecap", "round");
  s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true");
  d.split("|").forEach(p => { const path = document.createElementNS(s.namespaceURI, "path");
    path.setAttribute("d", p); s.appendChild(path); });
  return s;
};
const ICON = {
  chevron: "m9 6 6 6-6 6",
  idea: "M9 18h6|M10 21h4|M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z",
  key: "M15 7a4 4 0 1 1-3.9 4.9L4 19v2h3v-2h2v-2h2l1.1-1.1A4 4 0 0 1 15 7Z",
  check: "m5 12 5 5 9-10",
  empty: "M3 10.5 12 3l9 7.5|M5 9.5V20h5v-6h4v6h5V9.5",
};
const day = (iso, opts) => iso ? new Date(iso + "T12:00:00").toLocaleDateString("en-GB",
  opts || {day: "numeric", month: "short"}) : "Not set";
const daysUntil = (iso) => iso ? Math.round((new Date(iso + "T12:00:00") - new Date()) / 86400000) : null;
const channel = (c) => ({email: "Email", letter: "Letter", phone: "Phone", online_form: "Online form",
  direct: "Done by the bank", in_person: "In person"})[c] || (c || "").replace(/_/g, " ");
const initials = (org) => (org || "?").replace(/\(.*?\)/g, "").split(/[\s:]+/).filter(Boolean).slice(0, 2)
  .map(w => w[0].toUpperCase()).join("");

// State kept across the 5-second refreshes.
let last = null, busy = false, sheetFor = null, lastFocus = null;
const openGroups = new Set(["approved"]);

function chip(text, cls) { return el("span", text, "chip" + (cls ? " " + cls : "")); }
function taskRow(t, opts) {
  const li = el("li");
  const row = el(opts.onOpen ? "button" : "div", undefined, "row");
  if (opts.onOpen) {
    row.type = "button";
    row.onclick = () => opts.onOpen(t);
    row.setAttribute("aria-label", "Read and approve the letter to " + t.org);
  }
  const av = el("span", undefined, "avatar" + (t.legal_requirement ? " legal" : opts.done ? " ok" : ""));
  if (opts.done) av.appendChild(svg(ICON.check)); else av.textContent = initials(t.org);
  row.appendChild(av);
  const main = el("div", undefined, "main");
  main.appendChild(el("div", t.org, "name"));
  const meta = el("div", undefined, "meta");
  const left = daysUntil(t.due_date);
  meta.appendChild(chip("Due " + day(t.due_date), !opts.done && left !== null && left <= 14 ? "soon" : ""));
  if (t.channel) meta.appendChild(chip(channel(t.channel)));
  if (t.legal_requirement) meta.appendChild(chip("Legal requirement", "legal"));
  main.appendChild(meta);
  if (t.follow_up && t.follow_up.length) {
    main.appendChild(el("div", "They asked for: " + t.follow_up.join(", "), "ask"));
  }
  row.appendChild(main);
  if (opts.onOpen) { const c = svg(ICON.chevron); c.setAttribute("class", "chev"); row.appendChild(c); }
  li.appendChild(row);
  return li;
}
function sectionHead(label, count, hot, extra) {
  const h = el("div", undefined, "section-head");
  const title = el("h2", label);
  title.appendChild(el("span", String(count), "count" + (hot ? " hot" : "")));
  h.appendChild(title);
  if (extra) h.appendChild(extra);
  return h;
}

function render(s) {
  if (!s) return;
  last = s;
  const app = document.getElementById("app");
  app.textContent = "";
  if (!s.case) {
    const c = el("div", undefined, "card empty");
    c.appendChild(svg(ICON.empty));
    c.appendChild(el("h2", "No move started yet", "title"));
    c.appendChild(el("p", s.hint, "muted"));
    app.appendChild(c);
    return;
  }
  const c = s.case;
  const hero = el("section", undefined, "hero");
  hero.appendChild(el("div", (c.first_names.length ? c.first_names.join(" and ") + "'s" : "Your") + " move",
    "eyebrow"));
  const route = el("div", undefined, "route");
  route.appendChild(document.createTextNode(c.from));
  route.appendChild(el("span", "→", "arrow"));
  route.appendChild(document.createTextNode(c.to));
  hero.appendChild(route);
  const dates = el("div", undefined, "dates");
  const left = daysUntil(c.completion_date);
  [[day(c.completion_date), "Completion" + (c.date_is_estimate ? " (estimate)" : "")
      + (left !== null && left >= 0 ? " · in " + left + " days" : "")],
   [day(c.exchange_date), "Exchange"]].forEach(([v, k]) => {
    const d = el("div", undefined, "date");
    d.appendChild(el("b", v));
    d.appendChild(el("span", k));
    dates.appendChild(d);
  });
  hero.appendChild(dates);
  app.appendChild(hero);

  const prog = el("div", undefined, "card progress");
  const label = el("div", undefined, "label");
  label.appendChild(el("b", s.stage));
  label.appendChild(el("span", "Step " + (s.stage_index + 1) + " of " + s.stages.length, "small muted"));
  prog.appendChild(label);
  const seg = el("div", undefined, "segments");
  s.stages.forEach((name, i) => {
    const b = el("i", "", i < s.stage_index ? "done" : i === s.stage_index ? "now" : "");
    b.title = name;
    seg.appendChild(b);
  });
  prog.appendChild(seg);
  const next = el("div", undefined, "next");
  next.appendChild(svg(ICON.idea));
  next.appendChild(el("div", s.hint));
  prog.appendChild(next);
  app.appendChild(prog);

  s.pending_confirmations.forEach(a => {
    const b = el("div", undefined, "banner");
    b.appendChild(svg(ICON.key));
    const t = el("div");
    t.appendChild(el("strong", "Waiting for your code in the chat"));
    t.appendChild(el("div", a.what + (a.items.length ? ": " + a.items.join(", ") : "")
      + (a.skips.length ? " · skipping " + a.skips.join(", ") : ""), "small"));
    t.appendChild(el("div", "Type the code you were shown before "
      + new Date(a.expires_at).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}), "small muted"));
    b.appendChild(t);
    app.appendChild(b);
  });

  s.groups.forEach(g => {
    if (g.status === "awaiting_approval") {
      const routine = g.tasks.filter(t => !t.legal_requirement);
      let bulkBtn = null;
      if (routine.length > 1) {
        bulkBtn = el("button", "Approve " + routine.length, "btn small secondary");
        bulkBtn.type = "button";
        bulkBtn.disabled = busy;
        bulkBtn.onclick = () => openBulk(routine);
      }
      app.appendChild(sectionHead("Waiting for your approval", g.tasks.length, true, bulkBtn));
      const list = el("ul", undefined, "list");
      g.tasks.forEach(t => list.appendChild(taskRow(t, {onOpen: openDraft})));
      app.appendChild(list);
      return;
    }
    if (g.status === "needs_action") {
      app.appendChild(sectionHead("Needs your action", g.tasks.length, true));
      const list = el("ul", undefined, "list");
      g.tasks.forEach(t => list.appendChild(taskRow(t, {})));
      app.appendChild(list);
      return;
    }
    // Everything else folds away; what is open is remembered across refreshes.
    const det = el("details", undefined, "group");
    det.open = openGroups.has(g.status);
    det.ontoggle = () => det.open ? openGroups.add(g.status) : openGroups.delete(g.status);
    const sum = el("summary");
    const head = sectionHead(g.label, g.tasks.length, false);
    const chev = svg(ICON.chevron);
    chev.setAttribute("class", "chev");
    head.appendChild(chev);
    sum.appendChild(head);
    det.appendChild(sum);
    const list = el("ul", undefined, "list");
    const done = ["sent", "confirmed", "approved"].includes(g.status);
    g.tasks.forEach(t => list.appendChild(taskRow(t, {done})));
    det.appendChild(list);
    app.appendChild(det);
  });

  if (s.activity.length) {
    app.appendChild(sectionHead("Recent activity", s.activity.length, false));
    const tl = el("ul", undefined, "timeline");
    s.activity.forEach(a => {
      const li = el("li");
      li.appendChild(el("span", "", "dot"));
      const t = el("div");
      t.appendChild(el("div", a.event + (a.org ? ": " + a.org : "")));
      t.appendChild(el("div", new Date(a.at).toLocaleString([], {day: "numeric", month: "short", hour: "2-digit",
        minute: "2-digit"}), "when"));
      li.appendChild(t);
      tl.appendChild(li);
    });
    app.appendChild(tl);
  }
}

// ----- Bottom sheet: read a letter, then approve that exact wording -----
function letter(d) {
  const box = el("div", undefined, "letter");
  box.appendChild(el("div", d.subject || "(no subject)", "subject"));
  const pre = el("pre");
  // {{placeholders}} show as highlighted labels: they are filled in from the customer's record when it is sent.
  (d.body || "").split(/(\{\{\s*\w+\s*\}\})/).forEach(part => {
    const m = part.match(/^\{\{\s*(\w+)\s*\}\}$/);
    pre.appendChild(m ? el("span", m[1].replace(/_/g, " "), "placeholder") : document.createTextNode(part));
  });
  box.appendChild(pre);
  return box;
}
async function getDraft(taskId) {
  const r = await fetch("/draft/" + encodeURIComponent(taskId) + ".json", {cache: "no-store"});
  if (!r.ok) throw new Error("That letter is no longer waiting for approval.");
  return r.json();
}
function showSheet(title, bodyNodes, footNodes, ids) {
  lastFocus = document.activeElement;
  sheetFor = ids;
  document.getElementById("sheet-title").textContent = title;
  const body = document.getElementById("sheet-body"), foot = document.getElementById("sheet-foot");
  body.textContent = "";
  foot.textContent = "";
  bodyNodes.forEach(n => body.appendChild(n));
  footNodes.forEach(n => foot.appendChild(n));
  body.scrollTop = 0;
  const sheet = document.getElementById("sheet");
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden", "false");
  document.getElementById("scrim").classList.add("open");
  document.body.style.overflow = "hidden";
  setTimeout(() => document.getElementById("sheet-close").focus(), 50);
}
function closeSheet() {
  sheetFor = null;
  const sheet = document.getElementById("sheet");
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden", "true");
  document.getElementById("scrim").classList.remove("open");
  document.body.style.overflow = "";
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function footer(approveText, drafts) {
  const ok = el("button", approveText, "btn block");
  ok.type = "button";
  ok.onclick = () => approve(drafts, ok);
  const later = el("button", "Not now", "btn ghost block");
  later.type = "button";
  later.onclick = closeSheet;
  return [ok, later];
}
async function openDraft(t) {
  let d;
  try { d = await getDraft(t.task_id); } catch (e) { toast(e.message, true); return; }
  const facts = el("div", undefined, "facts");
  [["Due", day(d.due_date)], ["How", channel(d.channel)], ["Type", d.legal_requirement ? "Legal" : "Routine"]]
    .forEach(([k, v]) => {
      const f = el("div");
      f.appendChild(el("span", k));
      f.appendChild(el("b", v));
      facts.appendChild(f);
    });
  const note = el("p", "Highlighted details are filled in from your record when it is sent. If the assistant "
    + "rewrites this letter, you will be asked again.", "small muted");
  showSheet(d.org, [facts, letter(d), note], footer("Approve this letter", [d]), [d.task_id]);
}
async function openBulk(tasks) {
  let drafts;
  try { drafts = await Promise.all(tasks.map(t => getDraft(t.task_id))); }
  catch (e) { toast(e.message, true); return; }
  const intro = el("p", "Tap a letter to read it. Legal requirements are not included: approve each of those "
    + "on its own.", "small muted");
  const items = drafts.map(d => {
    const det = el("details", undefined, "bulk-item");
    const sum = el("summary");
    sum.appendChild(el("span", d.org));
    sum.appendChild(el("span", "Due " + day(d.due_date), "small muted"));
    det.appendChild(sum);
    det.appendChild(letter(d));
    return det;
  });
  showSheet("Approve " + drafts.length + " letters", [intro, ...items],
    footer("Approve all " + drafts.length, drafts), drafts.map(d => d.task_id));
}
async function approve(drafts, button) {
  busy = true;
  button.disabled = true;
  button.textContent = "Approving…";
  try {
    const r = await fetch("/approve", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({approve: drafts.map(d => ({task_id: d.task_id, draft_hash: d.draft_hash}))})});
    const result = await r.json();
    if (!r.ok) {
      toast("Not approved: " + (result.error || r.status), true);
    } else {
      const n = result.approved.length;
      if (result.not_applied.length) {
        toast((n ? n + " approved. " : "") + "Not approved: " + result.not_applied.join("; "), true);
      } else {
        toast(n === 1 ? "Approved. Ask the assistant to send it."
          : n + " letters approved. Ask the assistant to send them.");
      }
    }
  } catch (e) { toast("Could not approve: " + e.message, true); }
  busy = false;
  closeSheet();
  await refresh();
}
document.getElementById("sheet-close").onclick = closeSheet;
document.getElementById("scrim").onclick = closeSheet;
addEventListener("keydown", e => { if (e.key === "Escape" && sheetFor) closeSheet(); });

async function refresh() {
  try {
    const r = await fetch("/status.json", {cache: "no-store"});
    if (r.status === 401) { location.href = "/"; return; }
    const s = await r.json();
    // If what the open sheet shows was approved elsewhere (for example in the chat), close it.
    const waiting = new Set((s.awaiting_approval || []).map(t => t.task_id));
    if (sheetFor && !busy && sheetFor.some(id => !waiting.has(id))) {
      closeSheet();
      toast("Those letters changed in the meantime. Please take another look.", true);
    }
    render(s);
  } catch (e) { /* Offline for a moment: keep showing the last state. */ }
}
refresh();
setInterval(refresh, 5000);
</script>
