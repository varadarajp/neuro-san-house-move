<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My move</title>
<style>
  :root { color-scheme: light dark; --accent: #2f7d6d; --warm: #e07a5f; --muted: #6b7f7b; --tint: #2f7d6d14;
          --line: #8884; }
  body { font-family: system-ui, sans-serif; max-width: 56rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.45; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  h1 { margin: 0; } h2 { font-size: 1.1rem; margin: 0 0 .6rem; }
  .muted { color: var(--muted); } .small { font-size: .85rem; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.25rem; margin: 1rem 0; }
  .steps { display: flex; gap: .4rem; margin: 1rem 0 .4rem; flex-wrap: wrap; }
  .step { flex: 1 1 6rem; text-align: center; padding: .45rem .3rem; border-radius: 8px; background: var(--tint);
          font-size: .85rem; color: var(--muted); }
  .step.done { background: #2f7d6d33; color: inherit; }
  .step.now { background: var(--accent); color: #fff; font-weight: 600; }
  .hint { border-left: 4px solid var(--accent); padding: .4rem .9rem; background: var(--tint);
          border-radius: 0 8px 8px 0; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  .badge { display: inline-block; font-size: .72rem; padding: .05rem .45rem; border-radius: 999px;
           background: var(--warm); color: #fff; margin-left: .35rem; }
  .pending { border-color: var(--warm); }
  a { color: var(--accent); }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: .35rem .8rem;
           font-size: .9rem; cursor: pointer; }
  button.quiet { background: transparent; color: inherit; border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: wait; }
  .group-head { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
  .draft { background: var(--tint); border-radius: 8px; padding: .7rem .9rem; margin: .2rem 0 .5rem; }
  .draft pre { white-space: pre-wrap; font: inherit; margin: .4rem 0 .7rem; }
  .actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .notice { border-left: 4px solid var(--accent); padding: .4rem .9rem; margin: 1rem 0; }
  .notice.bad { border-color: var(--warm); }
  td.act { text-align: right; white-space: nowrap; }
  @media (max-width: 600px) { th:nth-child(3), td:nth-child(3) { display: none; } td.act { white-space: normal; } }
</style></head>
<body>
<header><h1>My move</h1><span class="small muted" id="updated"></span></header>
<div id="notice"></div>
<div id="app" class="muted">Loading…</div>
<p class="small"><a href="/">Back to the portal</a> · Updates every 5 seconds. Approve here after reading each draft, or in the chat with a code.</p>
<script>
// Everything is rendered with textContent, so nothing from the case is ever interpreted as HTML.
const el = (tag, text, cls) => {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
};
// after(r) may return an element shown in a full-width row under that row (an opened draft).
function table(rows, cols, after) {
  const t = el("table"), head = el("tr");
  cols.forEach(c => head.appendChild(el("th", c[0])));
  t.appendChild(head);
  rows.forEach(r => {
    const tr = el("tr");
    cols.forEach(c => { const td = el("td"); c[1](td, r); tr.appendChild(td); });
    t.appendChild(tr);
    const extra = after && after(r);
    if (extra) {
      const row = el("tr"), td = el("td");
      td.colSpan = cols.length;
      td.appendChild(extra);
      row.appendChild(td);
      t.appendChild(row);
    }
  });
  return t;
}
// Page state kept across refreshes: opened drafts (task_id -> draft) and the "approve all" list being confirmed.
const opened = {}, expanded = new Set();
let bulk = null, busy = false, last = null;
const button = (text, onClick, cls) => { const b = el("button", text, cls); b.type = "button";
  b.disabled = busy; b.onclick = onClick; return b; };
function notify(text, bad) {
  const n = document.getElementById("notice");
  n.textContent = "";
  if (text) n.appendChild(el("p", text, "notice" + (bad ? " bad" : "")));
}
async function getDraft(taskId) {
  const r = await fetch("/draft/" + encodeURIComponent(taskId) + ".json", {cache: "no-store"});
  if (!r.ok) throw new Error("That draft is no longer waiting for approval.");
  return r.json();
}
async function toggle(taskId) {
  if (opened[taskId]) { delete opened[taskId]; render(last); return; }
  try { opened[taskId] = await getDraft(taskId); notify(""); } catch (e) { notify(e.message, true); }
  render(last);
}
async function approve(drafts) {
  busy = true; render(last);
  try {
    const r = await fetch("/approve", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({approve: drafts.map(d => ({task_id: d.task_id, draft_hash: d.draft_hash}))})});
    const result = await r.json();
    if (!r.ok) { notify("Not approved: " + (result.error || r.status), true); }
    else {
      const names = drafts.filter(d => result.approved.includes(d.task_id)).map(d => d.org);
      notify((names.length ? "Approved: " + names.join(", ") + ". Ask the assistant to send them." : "Nothing approved.")
        + (result.not_applied.length ? " Not approved: " + result.not_applied.join("; ") + "." : ""),
        !names.length);
    }
    drafts.forEach(d => delete opened[d.task_id]);
    bulk = null;
  } catch (e) { notify("Could not approve: " + e.message, true); }
  busy = false;
  await refresh();
}
async function startBulk(tasks) {
  try { bulk = await Promise.all(tasks.map(t => getDraft(t.task_id))); notify(""); }
  catch (e) { notify(e.message, true); }
  render(last);
}
function draftPanel(d, withButton) {
  const box = el("div", undefined, "draft");
  box.appendChild(el("strong", d.subject || "(no subject)"));
  box.appendChild(el("pre", d.body || ""));
  if (withButton) {
    const actions = el("div", undefined, "actions");
    actions.appendChild(button("Approve this draft", () => approve([d])));
    actions.appendChild(el("span", "Details in {{ }} are filled in from your record when it is sent.",
      "small muted"));
    box.appendChild(actions);
  }
  return box;
}
function bulkPanel() {
  const box = el("div", undefined, "card pending");
  box.appendChild(el("h2", "Approve these " + bulk.length + " drafts?"));
  bulk.forEach(d => {
    const det = el("details");
    det.open = expanded.has(d.task_id);
    det.ontoggle = () => det.open ? expanded.add(d.task_id) : expanded.delete(d.task_id);
    det.appendChild(el("summary", d.org + ", due " + (d.due_date || "not set")));
    det.appendChild(draftPanel(d, false));
    box.appendChild(det);
  });
  box.appendChild(el("p", "Legal requirements are not included: open and approve each of those on its own.",
    "small muted"));
  const actions = el("div", undefined, "actions");
  actions.appendChild(button("Approve " + bulk.length + " drafts", () => approve(bulk)));
  actions.appendChild(button("Cancel", () => { bulk = null; render(last); }, "quiet"));
  box.appendChild(actions);
  return box;
}
const orgCell = (td, r) => {
  td.textContent = r.org || "";
  if (r.legal_requirement) td.appendChild(el("span", "legal", "badge"));
  if (r.follow_up && r.follow_up.length) td.appendChild(el("div", "Asked for: " + r.follow_up.join(", "), "small muted"));
};
const taskCols = [
  ["Organisation", orgCell],
  ["Due", (td, r) => td.textContent = r.due_date || ""],
  ["How", (td, r) => td.textContent = (r.channel || "").replace("_", " ")],
];
function render(s) {
  if (!s) return;
  last = s;
  const app = document.getElementById("app");
  app.textContent = "";
  app.className = "";
  if (!s.case) { app.appendChild(el("p", s.hint, "hint")); return; }
  const c = s.case, head = el("div", undefined, "card");
  head.appendChild(el("h2", (c.first_names.join(" and ") || "Your move") + ": " + c.from + " → " + c.to));
  head.appendChild(el("div", "Completion " + (c.completion_date || "not set") + (c.date_is_estimate ? " (estimate)" : "")
    + (c.exchange_date ? " · Exchange " + c.exchange_date : "") + " · Case " + c.reference, "small muted"));
  const steps = el("div", undefined, "steps");
  s.stages.forEach((name, i) => steps.appendChild(
    el("div", name, "step" + (i < s.stage_index ? " done" : i === s.stage_index ? " now" : ""))));
  head.appendChild(steps);
  head.appendChild(el("p", s.hint, "hint"));
  app.appendChild(head);
  if (s.pending_confirmations.length) {
    const p = el("div", undefined, "card pending");
    p.appendChild(el("h2", "Waiting for your confirmation code"));
    s.pending_confirmations.forEach(a => {
      p.appendChild(el("div", a.what + (a.items.length ? ": " + a.items.join(", ") : "")
        + (a.skips.length ? " · skipping " + a.skips.join(", ") : "")));
      p.appendChild(el("div", "Type the code from the chat before " + new Date(a.expires_at).toLocaleTimeString(),
        "small muted"));
    });
    app.appendChild(p);
  }
  if (bulk) app.appendChild(bulkPanel());
  s.groups.forEach(g => {
    const card = el("div", undefined, "card"), head = el("div", undefined, "group-head");
    head.appendChild(el("h2", g.label + " (" + g.tasks.length + ")"));
    if (g.status !== "awaiting_approval") {
      card.appendChild(head);
      card.appendChild(table(g.tasks, taskCols));
      app.appendChild(card);
      return;
    }
    const routine = g.tasks.filter(t => !t.legal_requirement);
    if (routine.length > 1 && !bulk) {
      head.appendChild(button("Approve all " + routine.length + " except legal…", () => startBulk(routine), "quiet"));
    }
    card.appendChild(head);
    const cols = taskCols.concat([["", (td, r) => {
      td.className = "act";
      td.appendChild(button(opened[r.task_id] ? "Hide" : "Read and approve", () => toggle(r.task_id), "quiet"));
    }]]);
    card.appendChild(table(g.tasks, cols, r => opened[r.task_id] && draftPanel(opened[r.task_id], true)));
    app.appendChild(card);
  });
  if (s.activity.length) {
    const a = el("div", undefined, "card");
    a.appendChild(el("h2", "Recent activity"));
    a.appendChild(table(s.activity, [
      ["When", (td, r) => td.textContent = new Date(r.at).toLocaleString()],
      ["What", (td, r) => td.textContent = r.event],
      ["", (td, r) => td.textContent = r.org || ""],
    ]));
    app.appendChild(a);
  }
}
async function refresh() {
  try {
    const r = await fetch("/status.json", {cache: "no-store"});
    if (r.status === 401) { location.href = "/"; return; }
    const s = await r.json();
    // Forget opened drafts that are no longer waiting (approved here or in the chat).
    const waiting = new Set((s.awaiting_approval || []).map(t => t.task_id));
    Object.keys(opened).forEach(id => { if (!waiting.has(id)) delete opened[id]; });
    if (bulk && bulk.some(d => !waiting.has(d.task_id))) bulk = null;
    render(s);
    document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById("updated").textContent = "Could not refresh";
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body></html>
